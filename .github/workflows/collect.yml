name: collect

on:
  schedule:
    # 평소에는 relay/worker.js 가 15분마다 시작합니다. 이 예약은 Worker가 멈췄을 때를 위한 예비입니다.
    - cron: '33 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 그룹 변경
        type: choice
        default: none
        options: [none, add, remove]
      name:
        description: 이름 (추가할 때)
        type: string
      lastfm_user:
        description: Last.fm 사용자 이름
        type: string
      service:
        description: 쓰는 서비스 (추가할 때)
        type: choice
        default: apple
        options: [apple, spotify]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 공개 저장소의 로그는 누구나 볼 수 있습니다. env로 넘기면 가리기 전에 로그에 찍히므로 이벤트 파일에서 읽습니다.
      - name: Hide member details from logs
        run: |
          for field in name lastfm_user; do
            value=$(jq -r ".inputs.$field // empty" "$GITHUB_EVENT_PATH")
            [ -z "$value" ] || echo "::add-mask::$value"
          done
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Restore database
        run: |
          if git fetch --depth=1 origin data; then
            git show FETCH_HEAD:crossfade.db.enc > crossfade.db.enc
          fi
      - name: Collect and build site
        run: npm run collect
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          INVITE_CODE: ${{ secrets.INVITE_CODE }}
          DB_KEY: ${{ secrets.DB_KEY }}
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          RELAY_URL: ${{ vars.RELAY_URL }}
          OPEN_ACCESS: ${{ vars.OPEN_ACCESS }}
          RELAY_READ_KEY: ${{ secrets.RELAY_READ_KEY }}
          TOKEN_PRIVATE_KEY: ${{ secrets.TOKEN_PRIVATE_KEY }}
          DB_PATH: ${{ runner.temp }}/crossfade.db
          MEMBER_ACTION: ${{ inputs.action }}
          MEMBER_NAME: ${{ inputs.name }}
          MEMBER_LASTFM: ${{ inputs.lastfm_user }}
          MEMBER_SERVICE: ${{ inputs.service }}
      # 저장소가 커지지 않도록 data 브랜치에는 커밋을 하나만 둡니다.
      - name: Save database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan data-next
          git rm -rfq --cached .
          git add -f crossfade.db.enc
          git commit -qm 'Update data'
          git push -qf origin HEAD:data
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
