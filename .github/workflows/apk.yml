name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 서명 키는 저장소가 공개라서 비밀 값으로만 둡니다. 없으면 시험용 키로 서명됩니다.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 가 없어 시험용 키로 서명합니다."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Crossfade.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Crossfade-apk
          path: Crossfade.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${{ github.run_number }}" Crossfade.apk \
            --title "크로스페이드 앱 #${{ github.run_number }}" \
            --notes "안드로이드 휴대폰에서 내려받아 설치하는 크로스페이드 앱이에요. 크로스페이드·Luma·Aria가 모두 들어 있어요." \
            --target "${{ github.sha }}" \
            --latest
